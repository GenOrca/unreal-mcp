name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        run: |
          VER="${{ steps.version.outputs.ver }}"

          # Extract VersionName from .uplugin (JSON)
          UPLUGIN_VER=$(python3 -c "
          import json, sys
          with open('Plugins/UnrealMCPython/UnrealMCPython.uplugin') as f:
              data = json.load(f)
          print(data['VersionName'])
          ")

          # Extract version from pyproject.toml
          PYPROJECT_VER=$(python3 -c "
          import re, sys
          with open('mcp-server/pyproject.toml') as f:
              text = f.read()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.MULTILINE)
          if not m:
              print('NOT_FOUND', file=sys.stderr); sys.exit(1)
          print(m.group(1))
          ")

          echo "Tag version:      $VER"
          echo "uplugin version:  $UPLUGIN_VER"
          echo "pyproject version: $PYPROJECT_VER"

          FAIL=0
          if [ "$UPLUGIN_VER" != "$VER" ]; then
            echo "::error::uplugin VersionName ($UPLUGIN_VER) does not match tag ($VER)"
            FAIL=1
          fi
          if [ "$PYPROJECT_VER" != "$VER" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VER) does not match tag ($VER)"
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then exit 1; fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate tool mappings
        run: python mcp-server/validate_tools.py

      - name: Package zip
        run: |
          VER="${{ steps.version.outputs.ver }}"
          # Source-only zip; named to match the precompiled binaries
          # (UnrealMCPython_<engine>_<ver>.zip) so the "Source" variant is obvious.
          ZIP_NAME="UnrealMCPython_Source_${VER}.zip"
          STAGE_DIR=$(mktemp -d)
          TARGET="$STAGE_DIR/UnrealMCPython"
          mkdir -p "$TARGET"

          # Copy included directories
          for dir in Plugins Docs mcp-server; do
            if [ -d "$dir" ]; then
              cp -r "$dir" "$TARGET/"
            fi
          done

          # Copy included files
          for file in README.md LICENSE.txt; do
            if [ -f "$file" ]; then
              cp "$file" "$TARGET/"
            fi
          done

          # Remove excluded patterns from the copy
          find "$TARGET" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$TARGET" -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true
          find "$TARGET" -name "*.pyc" -delete 2>/dev/null || true

          # Create zip
          (cd "$STAGE_DIR" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" UnrealMCPython)
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Build release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          REPO="${{ github.server_url }}/${{ github.repository }}"
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
            COMPARE="**Full Changelog**: $REPO/compare/$PREV...$TAG"
          else
            RANGE="$TAG"
            COMPARE=""
          fi
          # Commit-subject changelog, no per-PR author attribution.
          CHANGES=$(git log --no-merges --pretty=format:'- %s' "$RANGE" \
            | grep -vE '^- (chore: bump version|Merge )' || true)
          {
            echo "## What's Changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "$COMPARE"
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" "$ZIP_NAME" --clobber
          else
            gh release create "$TAG" \
              "$ZIP_NAME" \
              --notes-file release_notes.md \
              --title "$TAG"
          fi
